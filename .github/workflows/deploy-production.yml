name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: synzept-production
  cancel-in-progress: false

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend and API tests
        working-directory: backend
        run: python -m pytest

  deploy-backend:
    name: Deploy AWS EC2 Backend
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          AWS_EC2_PORT: ${{ secrets.AWS_EC2_PORT }}
          AWS_EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_EC2_SSH_KEY" > ~/.ssh/synzept_ec2
          chmod 600 ~/.ssh/synzept_ec2
          ssh-keyscan -p "${AWS_EC2_PORT:-22}" -H "$AWS_EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          AWS_EC2_PORT: ${{ secrets.AWS_EC2_PORT }}
          AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_PORT="${AWS_EC2_PORT:-22}"
          ssh -i ~/.ssh/synzept_ec2 -p "$SSH_PORT" "$AWS_EC2_USER@$AWS_EC2_HOST" \
            "BACKEND_DEPLOY_PATH='$BACKEND_DEPLOY_PATH' BACKEND_SERVICE_NAME='$BACKEND_SERVICE_NAME' BACKEND_HEALTH_URL='$BACKEND_HEALTH_URL' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          : "${BACKEND_DEPLOY_PATH:?BACKEND_DEPLOY_PATH is required}"
          : "${BACKEND_SERVICE_NAME:?BACKEND_SERVICE_NAME is required}"
          : "${BACKEND_HEALTH_URL:?BACKEND_HEALTH_URL is required}"
          : "${GITHUB_SHA:?GITHUB_SHA is required}"

          LOCK_FILE="/tmp/synzept-production-deploy.lock"
          exec 9>"$LOCK_FILE"
          flock -n 9

          cd "$BACKEND_DEPLOY_PATH"
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          echo "Previous backend revision: $PREVIOUS_SHA"
          echo "Deploying backend revision: $GITHUB_SHA"

          git fetch --prune origin main
          git reset --hard "$GITHUB_SHA"

          npm install
          npm run build
          sudo systemctl restart synzept-frontend.service

          cd backend
          if [ -f ".venv/bin/activate" ]; then
            . .venv/bin/activate
          elif [ -f "venv/bin/activate" ]; then
            . venv/bin/activate
          else
            echo "No backend virtual environment found at backend/.venv or backend/venv" >&2
            exit 1
          fi

          python -m pip install -r requirements.txt
          python -m alembic upgrade head

          sudo systemctl restart "$BACKEND_SERVICE_NAME"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BACKEND_HEALTH_URL" >/tmp/synzept-health.json; then
              cat /tmp/synzept-health.json
              echo
              echo "Backend health check passed on attempt $attempt"
              echo "$GITHUB_SHA" > /tmp/synzept-last-successful-sha
              exit 0
            fi
            sleep 5
          done

          echo "Backend health check failed after restart." >&2
          echo "Previous backend revision was $PREVIOUS_SHA" >&2
          sudo journalctl -u "$BACKEND_SERVICE_NAME" -n 120 --no-pager >&2 || true
          exit 1
          REMOTE

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Synzept production deployment"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Backend host: EC2"
            echo "- Backend health: \`${{ secrets.BACKEND_HEALTH_URL }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
