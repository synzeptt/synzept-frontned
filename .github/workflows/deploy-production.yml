name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: synzept-production
  cancel-in-progress: false

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend and API tests
        working-directory: backend
        run: python -m pytest

  deploy-backend:
    name: Deploy AWS EC2 Backend
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSM deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?Set repository variable AWS_DEPLOY_ROLE_ARN}"
          : "${AWS_REGION:?Set repository variable AWS_REGION}"
          : "${AWS_EC2_INSTANCE_ID:?Set repository variable AWS_EC2_INSTANCE_ID}"
          : "${BACKEND_DEPLOY_PATH:?Set BACKEND_DEPLOY_PATH secret}"
          : "${BACKEND_SERVICE_NAME:?Set BACKEND_SERVICE_NAME secret}"
          : "${BACKEND_HEALTH_URL:?Set BACKEND_HEALTH_URL secret}"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: SynzeptProductionDeploy

      - name: Deploy backend
        env:
          AWS_EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSM_STATUS="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${AWS_EC2_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          if [[ "$SSM_STATUS" != "Online" ]]; then
            echo "EC2 instance is not online in Systems Manager (status: $SSM_STATUS)." >&2
            exit 1
          fi

          DEPLOY_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail

          : "${BACKEND_DEPLOY_PATH:?BACKEND_DEPLOY_PATH is required}"
          : "${BACKEND_SERVICE_NAME:?BACKEND_SERVICE_NAME is required}"
          : "${BACKEND_HEALTH_URL:?BACKEND_HEALTH_URL is required}"
          : "${GITHUB_SHA:?GITHUB_SHA is required}"

          LOCK_FILE="/tmp/synzept-production-deploy-${EUID}.lock"
          if [[ -e "$LOCK_FILE" || -L "$LOCK_FILE" ]]; then
            if [[ -L "$LOCK_FILE" || ! -f "$LOCK_FILE" || ! -O "$LOCK_FILE" ]]; then
              echo "Deployment lock file is not a regular file owned by UID $EUID." >&2
              exit 1
            fi
            chmod 600 "$LOCK_FILE"
          fi
          LOCK_UMASK="$(umask)"
          umask 077
          exec 9>"$LOCK_FILE"
          umask "$LOCK_UMASK"
          flock -n 9

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$BACKEND_DEPLOY_PATH"
          cd "$BACKEND_DEPLOY_PATH"
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          echo "Previous backend revision: $PREVIOUS_SHA"
          echo "Deploying backend revision: $GITHUB_SHA"

          git fetch --prune origin main
          git reset --hard "$GITHUB_SHA"

          npm install
          npm run build
          sudo systemctl restart synzept-frontend.service

          cd backend
          if [ -f ".venv/bin/activate" ]; then
            . .venv/bin/activate
          elif [ -f "venv/bin/activate" ]; then
            . venv/bin/activate
          else
            echo "No backend virtual environment found at backend/.venv or backend/venv" >&2
            exit 1
          fi

          python -m pip install -r requirements.txt
          python -m alembic upgrade head

          sudo systemctl restart "$BACKEND_SERVICE_NAME"

          HEALTH_TMP_DIR="$(mktemp -d /tmp/synzept-health.XXXXXX)"
          HEALTH_RESPONSE_FILE="$HEALTH_TMP_DIR/health.json"
          trap 'rm -rf -- "$HEALTH_TMP_DIR"' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BACKEND_HEALTH_URL" >"$HEALTH_RESPONSE_FILE"; then
              cat "$HEALTH_RESPONSE_FILE"
              echo
              echo "Backend health check passed on attempt $attempt"
              echo "$GITHUB_SHA" > /tmp/synzept-last-successful-sha
              exit 0
            fi
            sleep 5
          done

          echo "Backend health check failed after restart." >&2
          echo "Previous backend revision was $PREVIOUS_SHA" >&2
          sudo journalctl -u "$BACKEND_SERVICE_NAME" -n 120 --no-pager >&2 || true
          exit 1
          REMOTE
          )"
          PARAMETERS="$(jq -cn \
            --arg deploy_path "$BACKEND_DEPLOY_PATH" \
            --arg service_name "$BACKEND_SERVICE_NAME" \
            --arg health_url "$BACKEND_HEALTH_URL" \
            --arg github_sha "$GITHUB_SHA" \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [
              "bash -c " + ((
                "export BACKEND_DEPLOY_PATH=" + ($deploy_path | @sh) +
                "\nexport BACKEND_SERVICE_NAME=" + ($service_name | @sh) +
                "\nexport BACKEND_HEALTH_URL=" + ($health_url | @sh) +
                "\nexport GITHUB_SHA=" + ($github_sha | @sh) +
                "\n" + $script
              ) | @sh)
            ]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$AWS_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Synzept production deploy $GITHUB_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"
          echo "Started SSM deployment command."

          for attempt in $(seq 1 180); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$AWS_EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$AWS_EC2_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent}' \
                  --output json
                exit 0
                ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$AWS_EC2_INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for the SSM deployment command." >&2
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails}' \
            --output json || true
          exit 1
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Synzept production deployment"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Backend host: EC2"
            echo "- Backend health: \`${{ secrets.BACKEND_HEALTH_URL }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
